name: CI

# Valida cada PR hacia main y cada push a main: dependencias limpias (npm ci),
# todas las suites de scripts/test-*.mjs y el build de produccion.
# No usa secretos ni credenciales: el build recibe variables ficticias.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios: nunca se conecta a servicios reales.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El repo versiona node_modules con binarios de otra plataforma:
      # npm ci lo reemplaza por completo desde package-lock.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suites
        run: |
          status=0
          count=0
          for f in scripts/test-*.mjs; do
            count=$((count + 1))
            echo "::group::$f"
            if ! node "$f"; then
              echo "::error file=$f::suite failed"
              status=1
            fi
            echo "::endgroup::"
          done
          echo "Suites ejecutadas: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no se encontro ninguna suite en scripts/test-*.mjs"
            exit 1
          fi
          exit $status

      - name: Build
        run: npm run build

      - name: Verify build used placeholder environment
        run: |
          if grep -rqE "supabase\.co" dist/assets; then
            echo "::error::el bundle contiene un host de produccion; el build debe usar variables ficticias"
            exit 1
          fi
          grep -rq "example.invalid" dist/assets

      # Simula un build de Preview de Vercel: el guard de entorno (plugin de Vite) corre con VERCEL_ENV=preview y las
      # variables ficticias del job, y el escaner revisa que el bundle no contenga el host de produccion (comparacion por hash).
      - name: Env guard - Preview simulado
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
        run: |
          npm run build -- --outDir dist-preview --emptyOutDir
          node scripts/check-bundle-target.mjs dist-preview/assets --target preview
          rm -rf dist-preview

      # Simula un build de Production de Vercel con configuracion VALIDA (host de ejemplo, no real): el guard exige una URL
      # https con host real y una clave valida, y el escaner revisa el bundle.
      - name: Env guard - Production simulado (configuracion valida)
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          VITE_SUPABASE_URL: https://ci-simulado.example.com
          VITE_SUPABASE_ANON_KEY: ci-simulada-anon-key-0123456789
        run: |
          npm run build -- --outDir dist-prod --emptyOutDir
          node scripts/check-bundle-target.mjs dist-prod/assets --target production
          node scripts/check-demo-bundle.mjs dist-prod --expect=no-demo
          rm -rf dist-prod

      # El build de Production DEBE fallar si falta la configuracion: las variables vacias pisan al .env versionado.
      - name: Env guard - Production sin configuracion debe fallar
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: |
          if npm run build -- --outDir dist-prod-neg --emptyOutDir; then
            echo "::error::el build de Production con variables vacias debia fallar y termino bien"
            exit 1
          fi
          rm -rf dist-prod-neg

      # El build normal (el de Production lo es) no contiene ni codigo ni datos de demo.
      - name: Demo - el build normal no incluye el modo demo
        run: node scripts/check-demo-bundle.mjs dist --expect=no-demo

      # Build de demo explicito (interfaz del alumno con datos ficticios): sin URL ni clave de Supabase y con el demo incluido.
      - name: Demo - build explicito sin Supabase
        env:
          IRONTRACK_DEMO: "1"
        run: |
          npm run build -- --outDir dist-demo --emptyOutDir
          node scripts/check-demo-bundle.mjs dist-demo --expect=demo
          rm -rf dist-demo

      # Production NUNCA admite el modo demo: pedirlo hace fallar el build.
      - name: Demo - Production con IRONTRACK_DEMO debe fallar
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          IRONTRACK_DEMO: "1"
          VITE_SUPABASE_URL: https://ci-simulado.example.com
          VITE_SUPABASE_ANON_KEY: ci-simulada-anon-key-0123456789
        run: |
          if npm run build -- --outDir dist-prod-demo --emptyOutDir; then
            echo "::error::el build de Production con IRONTRACK_DEMO=1 debia fallar y termino bien"
            exit 1
          fi
