name: Deploy update-alumno-password

# Despliegue MANUAL y protegido de UNA sola Edge Function (update-alumno-password). Ningun agente tiene credenciales de produccion:
# el token vive en un entorno protegido de GitHub que exige la aprobacion de una persona ANTES de que el job pueda leer los secretos.
# Requisitos de configuracion y procedimiento: docs/despliegue-edge-functions.md
#
# Seguridad del flujo:
#  - solo workflow_dispatch (nunca por push ni pull_request), y solo desde main;
#  - environment "production-functions" (revisor obligatorio, ramas permitidas: main);
#  - permissions: contents: read; los inputs se validan por formato y pasan por variables de entorno (no se interpolan en el shell);
#  - despliega unicamente supabase/functions/update-alumno-password, con Verify JWT activado (nunca --no-verify-jwt);
#  - no ejecuta migraciones, no toca otras funciones, no toca el frontend ni Vercel, y no escribe secretos.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA completo (40 caracteres) del commit de main que se va a desplegar"
        required: true
        type: string
      expected_coach_uids:
        description: "UID(s) del entrenador separados por coma, EXACTAMENTE como estan en el secreto COACH_UIDS (son identificadores, no credenciales)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-update-alumno-password
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-functions
    env:
      FN: update-alumno-password
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_COACH_UIDS: ${{ inputs.expected_coach_uids }}
      # Valores ficticios para las suites y el build: nunca se conectan a servicios reales.
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - name: Validar entradas y configuracion
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::expected_sha debe ser un SHA completo de 40 caracteres hexadecimales"; exit 1; }
          echo "$EXPECTED_COACH_UIDS" | grep -Eiq '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}(,[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12})*$' || { echo "::error::expected_coach_uids debe ser UUID(s) separados por coma, sin espacios"; exit 1; }
          echo "$PROJECT_REF" | grep -Eq '^[a-z0-9]{20}$' || { echo "::error::falta o es invalida la variable SUPABASE_PROJECT_REF del entorno"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::falta el secreto SUPABASE_ACCESS_TOKEN del entorno"; exit 1; }

      - name: Checkout (solo main, historial completo)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar que se despliega exactamente el commit indicado
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || { echo "::error::el commit del flujo no coincide con expected_sha"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::el commit no pertenece a main"; exit 1; }
          if grep -rEq "verify_jwt[[:space:]]*=[[:space:]]*false" supabase 2>/dev/null; then echo "::error::el repositorio desactiva verify_jwt"; exit 1; fi
          test -f "supabase/functions/$FN/index.ts" && test -f "supabase/functions/$FN/handler.js" || { echo "::error::faltan index.ts o handler.js"; exit 1; }
          grep -q "COACH_UIDS" "supabase/functions/$FN/index.ts"
          grep -q "app_metadata.alumno_id" "supabase/functions/$FN/handler.js"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Suites y build (las mismas que el CI)
        run: |
          set -euo pipefail
          for f in scripts/test-*.mjs; do node "$f" >/dev/null || { echo "::error::falla $f"; exit 1; }; done
          npm run build >/dev/null

      - name: Instalar la CLI (version fija, sin accion de terceros)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli"
          npm install --prefix "$RUNNER_TEMP/cli" --no-audit --no-fund --no-save supabase@2.122.0
          echo "SUPA=$RUNNER_TEMP/cli/node_modules/.bin/supabase" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/cli/node_modules/.bin/supabase" --version

      - name: Verificaciones previas (no imprimen valores)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # 1) El secreto COACH_UIDS existe y su digest coincide con el UID del entrenador indicado por el propietario.
          LIST="$("$SUPA" secrets list --project-ref "$PROJECT_REF")"
          echo "$LIST" | awk -F'|' 'NR>2 {gsub(/ /,"",$1); print $1}' | grep -qx COACH_UIDS || { echo "::error::falta el secreto COACH_UIDS"; exit 1; }
          WANT="$(printf '%s' "$EXPECTED_COACH_UIDS" | sha256sum | cut -d' ' -f1)"
          echo "$LIST" | awk -F'|' '{g=$1; gsub(/ /,"",g)} g=="COACH_UIDS"' | grep -qi "$WANT" || { echo "::error::el digest de COACH_UIDS no coincide con los UID indicados"; exit 1; }
          # 2) Verify JWT activado en la funcion actual (si ya existe).
          HTTP="$(curl -sS -o "$RUNNER_TEMP/cur.json" -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FN")"
          case "$HTTP" in
            200)
              jq -e '.verify_jwt == true' "$RUNNER_TEMP/cur.json" >/dev/null || { echo "::error::Verify JWT no esta activado en la funcion actual"; exit 1; }
              PREV="$(jq -r '.version' "$RUNNER_TEMP/cur.json")"
              [[ "$PREV" =~ ^[0-9]+$ ]] || { echo "::error::version previa invalida"; exit 1; }
              echo "PREV_VERSION=$PREV" >> "$GITHUB_ENV" ;;
            404) echo "La funcion todavia no existe: primer despliegue." ;;
            *) echo "::error::no se pudo consultar la funcion actual (HTTP $HTTP): no se despliega"; exit 1 ;;
          esac

      - name: Desplegar SOLO esta funcion (Verify JWT activado)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          "$SUPA" functions deploy "$FN" --project-ref "$PROJECT_REF"

      - name: Verificacion posterior
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          NEW="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$FN")"
          echo "$NEW" | jq -e '.status == "ACTIVE" and .verify_jwt == true' >/dev/null || { echo "::error::la funcion no quedo ACTIVE con Verify JWT"; exit 1; }
          if [ -n "${PREV_VERSION:-}" ]; then test "$(echo "$NEW" | jq -r '.version')" -gt "$PREV_VERSION" || { echo "::error::la version no avanzo"; exit 1; }; fi
          # El codigo desplegado es el de main (salvo README).
          mkdir -p "$RUNNER_TEMP/deployed" && cd "$RUNNER_TEMP/deployed" && "$SUPA" functions download "$FN" --project-ref "$PROJECT_REF"
          diff -r --exclude=README.md "supabase/functions/$FN" "$GITHUB_WORKSPACE/supabase/functions/$FN"
          # Sin autorizacion => rechazada (no cambia nada).
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$FN" -H 'Content-Type: application/json' -d '{}')"
          test "$CODE" = "401" || { echo "::error::sin Authorization se esperaba 401 y fue $CODE"; exit 1; }
          echo "OK: version activa con Verify JWT, codigo identico a main, 401 sin autorizacion. Las pruebas de escritura quedan pendientes (cuentas ficticias)."
